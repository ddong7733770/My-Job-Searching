<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>통합 채용 대시보드</title>
    <!-- 구글 맵스 API (API 키 입력 필수) -->
    <script src="https://maps.googleapis.com/maps/api/js?key=본인의_구글_API_키를_여기에_입력하세요"></script>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; margin: 20px; color: #333; }
        .filter-section { background: #f8f9fa; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .filter-group { margin-bottom: 15px; }
        .filter-group strong { display: inline-block; width: 80px; }
        .btn { padding: 6px 12px; margin-right: 5px; border: 1px solid #ccc; background: white; border-radius: 20px; cursor: pointer; font-size: 13px; }
        .btn.active { background: #007bff; color: white; border-color: #007bff; }
        select, input[type="text"] { padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
        input[type="text"] { width: 350px; }
        
        #container { display: flex; gap: 20px; }
        #map { width: 60%; height: 600px; border-radius: 8px; border: 1px solid #ccc; cursor: crosshair; }
        #list { width: 40%; height: 600px; overflow-y: auto; padding-right: 10px; }
        .job-card { padding: 15px; margin-bottom: 15px; border: 1px solid #eee; border-radius: 8px; cursor: pointer; transition: 0.2s; background: white; }
        .job-card:hover { box-shadow: 0 4px 8px rgba(0,0,0,0.1); border-color: #007bff; }
        .platform-badge { display: inline-block; padding: 3px 8px; font-size: 12px; color: white; background-color: #333; border-radius: 4px; margin-bottom: 5px; }
        .exp-badge { display: inline-block; padding: 3px 8px; font-size: 12px; color: #007bff; background-color: #e7f1ff; border-radius: 4px; margin-bottom: 5px; border: 1px solid #007bff; }
        .dist-badge { color: #d9534f; font-weight: bold; font-size: 13px; float: right; }
        
        .plat-사람인 { background: #4876ef; }
        .plat-잡코리아 { background: #003a8c; }
        .plat-원티드 { background: #2b5ff1; }
        .plat-리멤버 { background: #ff7b30; }
    </style>
</head>
<body>
    <h2>🎯 내 직무 맞춤 채용 정보</h2>
    
    <div class="filter-section">
        <div class="filter-group">
            <strong>거주지 기준</strong>
            <input type="text" id="base-address" placeholder="도로명/지번 검색 또는 지도 클릭" value="경기도 용인시 수지구 죽전동 동성2차 아파트">
            <button class="btn" id="set-base-btn" style="background: #333; color: white;">주소 검색</button>
            <span style="font-size: 12px; color: #666; margin-left: 10px;">(💡 지도 위를 클릭해도 기준 위치가 변경됩니다)</span>
            
            <div style="margin-top: 10px; padding-left: 85px;" id="radius-filters">
                <button class="btn radius-btn active" data-val="999">전체 거리</button>
                <button class="btn radius-btn" data-val="5">반경 5km</button>
                <button class="btn radius-btn" data-val="10">10km</button>
                <button class="btn radius-btn" data-val="20">20km</button>
                <button class="btn radius-btn" data-val="30">30km</button>
            </div>
        </div>

        <div class="filter-group" style="margin-bottom: 0;">
            <button class="btn" id="sort-btn" style="border-color: #d9534f; color: #d9534f; width: 100%;">가까운 순 정렬 적용 ↓</button>
        </div>
    </div>

    <div id="container">
        <div id="map"></div>
        <div id="list"></div>
    </div>

    <script>
        let map, geocoder, baseMarker;
        let allJobs = [];
        let markers = [];
        let currentBaseLoc = { lat: 37.3253, lng: 127.1118 }; // 죽전동 동성2차
        
        let selectedRadius = 999;
        let sortByDistance = false;

        function getDistance(lat1, lon1, lat2, lon2) {
            if (!lat1 || !lon1 || !lat2 || !lon2) return 999;
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + 
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }

        function initMap() {
            geocoder = new google.maps.Geocoder();
            map = new google.maps.Map(document.getElementById("map"), {
                zoom: 12,
                center: currentBaseLoc,
            });

            baseMarker = new google.maps.Marker({
                position: currentBaseLoc,
                map: map,
                label: "🏠",
                title: "거주지 (기준점)"
            });

            // ⭐ [기능 추가] 지도 클릭 시 해당 위치로 기준점 변경 및 주소 역변환
            map.addListener('click', (e) => {
                const clickedLoc = { lat: e.latLng.lat(), lng: e.latLng.lng() };
                updateBaseLocation(clickedLoc);
                
                // 역지오코딩: 좌표를 한글 주소로 변환하여 검색창에 입력
                geocoder.geocode({ location: clickedLoc }, (results, status) => {
                    if (status === 'OK' && results[0]) {
                        document.getElementById('base-address').value = results[0].formatted_address.replace('대한민국 ', '');
                    }
                });
            });

            fetch('./data.json')
                .then(res => res.json())
                .then(data => {
                    allJobs = data;
                    updateDistances();
                    renderData();
                });
        }

        function updateBaseLocation(loc) {
            currentBaseLoc = loc;
            baseMarker.setPosition(currentBaseLoc);
            map.setCenter(currentBaseLoc);
            updateDistances();
            renderData();
        }

        function updateDistances() {
            allJobs.forEach(job => {
                job.distance = getDistance(currentBaseLoc.lat, currentBaseLoc.lng, job.lat, job.lng);
            });
        }

        function renderData() {
            const listContainer = document.getElementById("list");
            listContainer.innerHTML = '';
            markers.forEach(m => m.setMap(null));
            markers = [];

            let filtered = allJobs.filter(job => job.distance <= selectedRadius);

            if (sortByDistance) {
                filtered.sort((a, b) => a.distance - b.distance);
            }

            filtered.forEach(job => {
                const distText = job.distance === 999 ? '거리 미상' : job.distance.toFixed(1) + ' km';
                const expText = job.experience ? job.experience : "경력 무관";
                
                const card = document.createElement('div');
                card.className = 'job-card';
                card.onclick = () => window.open(job.link || '#', '_blank');
                card.innerHTML = `
                    <span class="platform-badge plat-${job.platform}">${job.platform}</span>
                    <span class="exp-badge">${expText}</span>
                    <span class="dist-badge">📍 ${distText}</span>
                    <h3 style="margin: 10px 0;">${job.title}</h3>
                    <p style="margin: 0;"><strong>${job.company}</strong></p>
                    <p style="font-size: 13px; color: #666; margin-top: 5px;">${job.address}</p>
                `;
                listContainer.appendChild(card);

                if (job.lat && job.lng) {
                    const marker = new google.maps.Marker({
                        position: { lat: job.lat, lng: job.lng },
                        map: map,
                        title: job.company
                    });
                    const info = new google.maps.InfoWindow({
                        content: `<div style="padding:5px;"><b>${job.company}</b><br>${expText}<br><a href="${job.link || '#'}" target="_blank">공고 보기</a></div>`
                    });
                    marker.addListener("click", () => info.open(map, marker));
                    markers.push(marker);
                }
            });
            document.getElementById('sort-btn').innerText = `가까운 순 정렬 (총 ${filtered.length}건)`;
        }

        // 반경 필터 버튼 이벤트
        document.getElementById('radius-filters').addEventListener('click', e => {
            if(e.target.tagName !== 'BUTTON') return;
            selectedRadius = parseInt(e.target.getAttribute('data-val'));
            Array.from(e.target.parentElement.children).forEach(btn => btn.classList.remove('active'));
            e.target.classList.add('active');
            renderData();
        });

        // 텍스트 주소 검색 (도로명, 지번 모두 지원)
        document.getElementById('set-base-btn').addEventListener('click', () => {
            const addr = document.getElementById('base-address').value;
            geocoder.geocode({ address: addr }, (results, status) => {
                if (status === 'OK') {
                    updateBaseLocation({
                        lat: results[0].geometry.location.lat(),
                        lng: results[0].geometry.location.lng()
                    });
                } else {
                    alert("정확한 도로명 또는 지번 주소를 입력해주세요.");
                }
            });
        });

        // 정렬 토글
        document.getElementById('sort-btn').addEventListener('click', (e) => {
            sortByDistance = !sortByDistance;
            e.target.style.background = sortByDistance ? '#d9534f' : 'white';
            e.target.style.color = sortByDistance ? 'white' : '#d9534f';
            renderData();
        });

        window.onload = initMap;
    </script>
</body>
</html>
